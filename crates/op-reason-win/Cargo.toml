# Plan C': op-reason on Windows as one exe (op-reason.exe), built on op-reason-core.
#
# A workspace of its own: the windows crate (a 9 MB download, 114 MB unpacked) stays out of the main Cargo.lock, so
# the WSL binary's Nix package and Linux CI do not fetch it. Run cargo from this directory.
[workspace]
members = [".", "fake-op", "fake-ssh"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pollenjp/op-reason"
authors = ["pollenjp"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "op-reason-win"
description = "op-reason for Windows as one exe (plan C'): the Windows entry, and the runner of calls from WSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "op-reason"
path = "src/main.rs"

[dependencies]
op-reason-core = { path = "../op-reason-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.152"

[target.'cfg(windows)'.dependencies]
# Direct2D takes points as windows-numerics' Vector2 (same family as the windows crate).
windows-numerics = "0.3.1"

# Win32 and WinRT through Microsoft's windows crate.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Embeds the manifest (Per-Monitor V2 DPI, asInvoker, version) without rc.exe.
embed-manifest = "1.5.1"

[lints]
workspace = true
