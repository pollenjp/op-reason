[workspace]
members = ["crates/op-reason-core", "crates/op-reason"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pollenjp/op-reason"
authors = ["pollenjp"]

[workspace.dependencies]
op-reason-core = { path = "crates/op-reason-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.152"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
libc = "0.2.191"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
