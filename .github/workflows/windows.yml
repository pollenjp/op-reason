name: Windows

# The launcher and the Windows entry on real Windows PowerShell 5.1 with a fake op.exe (the 1Password app cannot run
# in CI), and screenshots of the approval window posted on the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Also keeps two runs of one pull request from writing the screenshot branch and comment at the same time
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows PowerShell 5.1 (launcher, entry, call table)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: Call table against the Windows entry
        shell: powershell
        run: .\tests\windows\entry-plan.test.ps1
      - name: Launcher
        shell: powershell
        run: .\tests\windows\launcher.test.ps1
      - name: Windows entry (op-reason.ps1 and op-reason.cmd)
        shell: powershell
        run: .\tests\windows\entry.test.ps1
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

  screenshots:
    name: Post the screenshots on the pull request
    needs: [windows]
    # always(): a failed run's screenshots matter most. Pull requests from forks get a read-only token.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: window-screenshots
          path: screenshots
      - name: Comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SHOTS_DIR: screenshots
          SHOTS_SOURCE: .github/workflows/windows.yml
          GRID_COLS: "2"
          IMG_WIDTH: "380"
        run: |
          .github/scripts/pr-screenshots.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ needs.windows.result }}"
