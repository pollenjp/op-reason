name: Release

# Builds the release assets when a v* tag is pushed and attaches them to a draft release. The maintainer reviews the
# draft and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Target
        run: rustup target add "${{ matrix.target }}"
      - name: Build (static, musl)
        run: cargo build --locked --release --target "${{ matrix.target }}" --package op-reason
      - name: Assets
        run: |
          mkdir dist
          name="op-reason-${{ matrix.arch }}-linux"
          cp "target/${{ matrix.target }}/release/op-reason" "dist/${name}"
          "target/${{ matrix.target }}/release/op-reason" --version # under another name, --version goes to op.exe
          (cd dist && sha256sum "${name}" >"${name}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # op-reason-windows.zip: op-reason.exe (crates/op-reason-win, a Cargo workspace of its own; not signed) and the
  # PowerShell fallback (launcher.ps1, op-reason.ps1, op-reason.cmd), with SKILL.md, the READMEs and the licenses.
  windows:
    name: Windows zip
    runs-on: windows-2025
    defaults:
      run:
        working-directory: crates/op-reason-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (crates/op-reason-win/rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build (the C runtime linked statically, see crates/op-reason-win/.cargo/config.toml)
        run: cargo build --locked --release -p op-reason-win
      # windows-exe.yml runs the same script on every pull request
      - name: Assets
        shell: pwsh
        run: ../../.github/scripts/windows-dist.ps1 -Exe target/release/op-reason.exe -Out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip
          path: crates/op-reason-win/dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes "See the README for installation. op-reason-<arch>-linux is the WSL executable. op-reason-windows.zip holds op-reason.exe (the Windows entry, and the window of calls from WSL; not signed) and the PowerShell fallback for machines where Smart App Control blocks op-reason.exe. Install both on a WSL machine. Each asset has a .sha256 file."
