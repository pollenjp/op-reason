name: Screenshots cleanup

# Deletes the screenshot branches of a pull request when it is closed or merged: screenshots/pr-<number> (written by
# windows.yml) and windows-exe-screenshots/pr-<number> (written by windows-exe.yml). Keep it together with those two.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-24.04
    steps:
      # A pull request that never got screenshots has no branch: do not fail
      - name: Delete the screenshot branches
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for ref in "heads/screenshots/pr-${NUMBER}" "heads/windows-exe-screenshots/pr-${NUMBER}"; do
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/${ref}"; then
              echo "deleted ${ref}"
            else
              echo "no branch (nothing to do): ${ref}"
            fi
          done
