name: Screenshots cleanup

# Deletes the screenshot branch of a pull request (screenshots/pr-<number>, written by windows.yml) when the pull
# request is closed or merged. Keep it together with windows.yml.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-24.04
    steps:
      # A pull request that never got screenshots has no branch: do not fail
      - name: Delete the screenshot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="heads/screenshots/pr-${{ github.event.pull_request.number }}"
          if gh api -X DELETE "repos/${{ github.repository }}/git/refs/${ref}"; then
            echo "deleted ${ref}"
          else
            echo "no branch (nothing to do): ${ref}"
          fi
