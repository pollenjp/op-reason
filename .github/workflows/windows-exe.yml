# Plan C': op-reason.exe for Windows (crates/op-reason-win, a workspace of its own). Lints and tests it, builds the
# exe, runs it with the fake op.exe on a real Windows desktop, takes screenshots of its window and of the A' launcher's
# window, measures how fast both start, and puts the screenshots on the pull request.
name: windows-exe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Also keeps two runs of one pull request from writing the screenshot branch and comment at the same time.
concurrency:
  group: windows-exe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: C' neutral modules on Linux (fmt, clippy, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/op-reason-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Format
        # -p, not --all: --all also formats the core (a path dependency), which the main workspace checks
        run: nix develop path:../../nix --command cargo fmt --check -p op-reason-win -p fake-op
      - name: Clippy
        run: nix develop path:../../nix --command cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (the window texts against launcher/launcher.ps1, the command-line length)
        run: nix develop path:../../nix --command cargo test --locked --workspace

  windows:
    name: C' op-reason.exe on Windows (clippy, test, build, screenshots, timing)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # Plan A' (the PowerShell entry, PR #3) at a fixed commit, measured next to the exe. Update it when PR #3 moves.
      A_PRIME_COMMIT: 0657395af2a9b4a1d91df79eb0a02c38c19657be
    defaults:
      run:
        working-directory: crates/op-reason-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (crates/op-reason-win/rust-toolchain.toml)
        run: rustup toolchain install
      - name: Clippy (the Windows-only code compiles only here)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the fake op.exe
        run: cargo build --locked -p fake-op
      - name: Tests (the desktop-mode tests show the window on the runner's desktop)
        run: cargo test --locked --workspace
      - name: Release build
        run: cargo build --locked --release -p op-reason-win
      - name: SHA-256 of the exe
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/op-reason.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path target/release/op-reason.exe.sha256 -Value "$hash  op-reason.exe" -Encoding ascii
          "op-reason.exe SHA-256: $hash" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      # For trying by hand on the author's machine (unsigned: Smart App Control may block it).
      - name: Upload the exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: op-reason-exe
          path: |
            crates/op-reason-win/target/release/op-reason.exe
            crates/op-reason-win/target/release/op-reason.exe.sha256
          if-no-files-found: error
      # If the commit cannot be fetched, the comparison falls back to the launcher of this branch.
      - name: Check out plan A' (PR #3) at the fixed commit
        continue-on-error: true
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$A_PRIME_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/a-prime" "$A_PRIME_COMMIT"
      - name: Screenshots and timings (the exe, and plan A' for comparison)
        shell: pwsh
        run: |
          $p = @{ Exe = 'target/release/op-reason.exe'; FakeOp = 'target/debug/op.exe'; Out = 'screenshots' }
          $a = Join-Path $env:RUNNER_TEMP 'a-prime'
          if (Test-Path (Join-Path $a 'windows/op-reason.ps1')) {
            $p.Launcher = Join-Path $a 'launcher/launcher.ps1'
            $p.Entry = Join-Path $a 'windows/op-reason.ps1'
            $p.EntryCmd = Join-Path $a 'windows/op-reason.cmd'
            $p.EntryLabel = "PR #3 at $($env:A_PRIME_COMMIT.Substring(0, 7))"
          } else {
            $p.Launcher = '../../launcher/launcher.ps1'
          }
          & ../../.github/scripts/windows-exe-shots.ps1 @p
      - name: Upload screenshots and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe-screenshots
          path: crates/op-reason-win/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # Only this job has write access, and it runs no code from the build: it posts the screenshots that the Windows job
  # uploaded. The three conditions: failed runs' screenshots are wanted too (always()), only pull requests have a
  # number, and pull requests from forks get no write token.
  screenshots:
    name: C' screenshots on the pull request
    needs: windows
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the screenshot branch
      pull-requests: write # the sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe-screenshots
          path: screenshots
        continue-on-error: true
      - name: Post the screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOTS_DIR: screenshots
          SHOTS_MARKER: "<!-- windows-exe-screenshots -->"
          SHOTS_BRANCH: windows-exe-screenshots/pr-${{ github.event.pull_request.number }}
          SHOTS_TITLE: "op-reason.exe (plan C') and the A' launcher on Windows"
          SHOTS_SOURCE: windows-exe.yml
          GRID_COLS: "3"
          IMG_WIDTH: "320"
        run: >-
          .github/scripts/pr-screenshots.sh
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.head.sha }}"
          "${{ needs.windows.result }}"
