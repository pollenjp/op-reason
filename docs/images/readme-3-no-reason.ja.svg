<title id="title">op-reason: 理由の無い呼び出し</title>
<desc id="desc">アニメーション: 理由 (--reason) の無い op read &quot;op://Private/proxmox/token&quot; は、窓も承認の画面も出る前にすぐ断られる。短い使い方と「op-reason: 理由 (--reason) がありません。人が打つときも要ります。」が出て、echo $? で終了コード 2 が出る。</desc>
