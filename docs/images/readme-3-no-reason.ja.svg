<g clip-path="url(#c2)"><text x="26" y="62" font-size="11" fill="#3b8eea" class="m" textLength="70.91" lengthAdjust="spacing" xml:space="preserve">~/src/infra</text><text x="96.91" y="62" font-size="11" fill="#cccccc" class="m" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">$</text><g class="k1"><rect class="blink" x="109.8" y="52.54" width="6.45" height="12.1" fill="#cccccc"/></g><g class="k2"><text x="109.8" y="62" font-size="11" fill="#cccccc" class="m" textLength="232.06" lengthAdjust="spacing" xml:space="preserve">op read &quot;op://Private/proxmox/token&quot;</text></g><g class="k3"><rect class="blink" x="341.85" y="52.54" width="6.45" height="12.1" fill="#cccccc"/></g><g class="k4"><rect x="22" y="162.78" width="426.99" height="15.62" rx="3" fill="#fbbf24" fill-opacity=".26" class="k5"/><text x="26" y="78" font-size="11" fill="#cccccc" class="m" textLength="341.64" lengthAdjust="spacing" xml:space="preserve">使い方: op --reason &quot;&lt;なぜ op を呼ぶか&gt;&quot; &lt;op の引数…&gt;</text><text x="38.89" y="94" font-size="11" fill="#cccccc" class="m" textLength="683.28" lengthAdjust="spacing" xml:space="preserve">この op は、呼ぶ理由を必須にした wrapper (op-reason) です。理由は 1Password の承認の画面と一緒に出る窓と、</text><text x="38.89" y="110" font-size="11" fill="#cccccc" class="m" textLength="541.46" lengthAdjust="spacing" xml:space="preserve">記録 (op-reason-log) に残ります。何のために何を読む・書くかを 1 文で書いてください。</text><text x="38.89" y="126" font-size="11" fill="#cccccc" class="m" textLength="676.83" lengthAdjust="spacing" xml:space="preserve">例: op --reason &quot;infra の VM を作るのに Proxmox の API の token を読む&quot; read &quot;op://Private/proxmox/token&quot;</text><text x="38.89" y="142" font-size="11" fill="#cccccc" class="m" textLength="670.38" lengthAdjust="spacing" xml:space="preserve">理由なしで通るのは --version と help (--help・-h・help) だけです。詳しい使い方は引数なしの op で出ます。</text><text x="38.89" y="158" font-size="11" fill="#cccccc" class="m" textLength="412.54" lengthAdjust="spacing" xml:space="preserve">AI エージェントは `op-reason --skill` で手引きを読んでください。</text><text x="26" y="174" font-size="11" fill="#cccccc" class="m" textLength="418.99" lengthAdjust="spacing" xml:space="preserve">op-reason: 理由 (--reason) がありません。人が打つときも要ります。</text></g><g class="k6"><text x="26" y="190" font-size="11" fill="#3b8eea" class="m" textLength="70.91" lengthAdjust="spacing" xml:space="preserve">~/src/infra</text><text x="96.91" y="190" font-size="11" fill="#cccccc" class="m" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">$</text><text x="109.8" y="190" font-size="11" fill="#cccccc" class="m" textLength="45.12" lengthAdjust="spacing" xml:space="preserve">echo $?</text></g><g class="k7"><rect class="blink" x="154.92" y="180.54" width="6.45" height="12.1" fill="#cccccc"/></g><g class="k8"><rect x="22" y="194.78" width="14.45" height="15.62" rx="3" fill="#fbbf24" fill-opacity=".26" class="k9"/><text x="26" y="206" font-size="11" fill="#ffffff" class="m b" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">2</text><text x="26" y="222" font-size="11" fill="#3b8eea" class="m" textLength="70.91" lengthAdjust="spacing" xml:space="preserve">~/src/infra</text><text x="96.91" y="222" font-size="11" fill="#cccccc" class="m" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">$</text><rect class="blink" x="109.8" y="212.54" width="6.45" height="12.1" fill="#cccccc"/></g></g>
<rect y="248" width="880" height="44" fill="#111827"/><g class="k10"><circle cx="28" cy="270" r="11" fill="#fbbf24"/><text x="28" y="274.5" font-size="12.5" fill="#111827" class="b" text-anchor="middle">1</text><text x="48" y="275" font-size="14" fill="#f9fafb">理由 (--reason) の無い op</text></g><g class="k11"><circle cx="28" cy="270" r="11" fill="#fbbf24"/><text x="28" y="274.5" font-size="12.5" fill="#111827" class="b" text-anchor="middle">2</text><text x="48" y="275" font-size="14" fill="#f9fafb">すぐ断る: 窓も承認の画面も出ない</text></g><g class="k12"><circle cx="28" cy="270" r="11" fill="#fbbf24"/><text x="28" y="274.5" font-size="12.5" fill="#111827" class="b" text-anchor="middle">3</text><text x="48" y="275" font-size="14" fill="#f9fafb">終了コードは 2。断ったことも記録に残る</text></g>
