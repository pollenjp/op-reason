<g clip-path="url(#c2)"><text x="26" y="62" font-size="11" fill="#3b8eea" class="m" textLength="70.91" lengthAdjust="spacing" xml:space="preserve">~/src/infra</text><text x="96.91" y="62" font-size="11" fill="#cccccc" class="m" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">$</text><g class="k1"><rect class="blink" x="109.8" y="52.54" width="6.45" height="12.1" fill="#cccccc"/></g><g class="k2"><text x="109.8" y="62" font-size="11" fill="#cccccc" class="m" textLength="232.06" lengthAdjust="spacing" xml:space="preserve">op read &quot;op://Private/proxmox/token&quot;</text></g><g class="k3"><rect class="blink" x="341.85" y="52.54" width="6.45" height="12.1" fill="#cccccc"/></g><g class="k4"><rect x="22" y="178.78" width="401.21" height="15.62" rx="3" fill="#fbbf24" fill-opacity=".26" class="k5"/><text x="26" y="78" font-size="11" fill="#cccccc" class="m" textLength="360.98" lengthAdjust="spacing" xml:space="preserve">Usage: op --reason &quot;&lt;why you call op&gt;&quot; &lt;op arguments...&gt;</text><text x="38.89" y="94" font-size="11" fill="#cccccc" class="m" textLength="702.61" lengthAdjust="spacing" xml:space="preserve">op is op-reason, a wrapper for the 1Password CLI: every call needs a reason. The reason appears in the window</text><text x="38.89" y="110" font-size="11" fill="#cccccc" class="m" textLength="721.95" lengthAdjust="spacing" xml:space="preserve">next to the 1Password approval prompt and in the log (op-reason-log). Write what for and what you read or write,</text><text x="38.89" y="126" font-size="11" fill="#cccccc" class="m" textLength="103.14" lengthAdjust="spacing" xml:space="preserve">in one sentence.</text><text x="38.89" y="142" font-size="11" fill="#cccccc" class="m" textLength="696.17" lengthAdjust="spacing" xml:space="preserve">Example: op --reason &quot;read the Proxmox API token to create the staging VM&quot; read &quot;op://Private/proxmox/token&quot;</text><text x="38.89" y="158" font-size="11" fill="#cccccc" class="m" textLength="709.06" lengthAdjust="spacing" xml:space="preserve">Only --version and help (--help, -h, help) work without a reason. Run op without arguments for the full usage.</text><text x="38.89" y="174" font-size="11" fill="#cccccc" class="m" textLength="348.08" lengthAdjust="spacing" xml:space="preserve">AI agents: run `op-reason --skill` for the full guide.</text><text x="26" y="190" font-size="11" fill="#cccccc" class="m" textLength="393.21" lengthAdjust="spacing" xml:space="preserve">op-reason: There is no reason (--reason). People need it too.</text></g><g class="k6"><text x="26" y="206" font-size="11" fill="#3b8eea" class="m" textLength="70.91" lengthAdjust="spacing" xml:space="preserve">~/src/infra</text><text x="96.91" y="206" font-size="11" fill="#cccccc" class="m" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">$</text><text x="109.8" y="206" font-size="11" fill="#cccccc" class="m" textLength="45.12" lengthAdjust="spacing" xml:space="preserve">echo $?</text></g><g class="k7"><rect class="blink" x="154.92" y="196.54" width="6.45" height="12.1" fill="#cccccc"/></g><g class="k8"><rect x="22" y="210.78" width="14.45" height="15.62" rx="3" fill="#fbbf24" fill-opacity=".26" class="k9"/><text x="26" y="222" font-size="11" fill="#ffffff" class="m b" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">2</text><text x="26" y="238" font-size="11" fill="#3b8eea" class="m" textLength="70.91" lengthAdjust="spacing" xml:space="preserve">~/src/infra</text><text x="96.91" y="238" font-size="11" fill="#cccccc" class="m" textLength="6.45" lengthAdjust="spacing" xml:space="preserve">$</text><rect class="blink" x="109.8" y="228.54" width="6.45" height="12.1" fill="#cccccc"/></g></g>
<rect y="264" width="880" height="44" fill="#111827"/><g class="k10"><circle cx="28" cy="286" r="11" fill="#fbbf24"/><text x="28" y="290.5" font-size="12.5" fill="#111827" class="b" text-anchor="middle">1</text><text x="48" y="291" font-size="14" fill="#f9fafb">op without --reason</text></g><g class="k11"><circle cx="28" cy="286" r="11" fill="#fbbf24"/><text x="28" y="290.5" font-size="12.5" fill="#111827" class="b" text-anchor="middle">2</text><text x="48" y="291" font-size="14" fill="#f9fafb">Refused at once: no window, no approval prompt</text></g><g class="k12"><circle cx="28" cy="286" r="11" fill="#fbbf24"/><text x="28" y="290.5" font-size="12.5" fill="#111827" class="b" text-anchor="middle">3</text><text x="48" y="291" font-size="14" fill="#f9fafb">Exit code 2, and the refusal is in the log</text></g>
