<title id="title">op-reason: a call without a reason</title>
<desc id="desc">Animation: op read &quot;op://Private/proxmox/token&quot; without --reason is refused at once, before any window or approval prompt: op-reason prints its short usage and &quot;op-reason: There is no reason (--reason). People need it too.&quot;, and echo $? shows the exit code 2.</desc>
